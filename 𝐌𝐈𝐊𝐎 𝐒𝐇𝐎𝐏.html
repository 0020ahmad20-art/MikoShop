<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIKO SHOP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Tahoma,sans-serif}
:root{--red:#e00000;--red2:#ff3517;--dark:#070707}
html{scroll-behavior:smooth}
body{min-height:100vh;background:var(--dark);color:#fff;overflow-x:hidden;padding-bottom:85px}
#backgroundCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 10% 10%,rgba(190,0,0,.14),transparent 30%),radial-gradient(circle at 90% 70%,rgba(255,40,10,.08),transparent 30%)}
.content{position:relative;padding:18px}
.container{width:100%;max-width:1200px;margin:auto}
header{position:sticky;top:12px;z-index:40;padding:14px 18px;margin-bottom:30px;background:rgba(10,10,10,.76);backdrop-filter:blur(20px);border:1px solid rgba(255,30,15,.2);border-radius:27px;box-shadow:0 15px 45px rgba(0,0,0,.35)}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:27px;font-weight:1000;letter-spacing:1px;background:linear-gradient(135deg,#fff,#ff5938);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-actions{display:flex;align-items:center;gap:9px}
.header-btn{border:1px solid rgba(255,30,15,.2);background:rgba(255,255,255,.045);color:#fff;border-radius:14px;padding:9px 13px;cursor:pointer;font-weight:800;transition:.25s}
.header-btn:hover{background:rgba(224,0,0,.16);border-color:rgba(255,40,20,.5);transform:translateY(-2px)}
.section-title{display:flex;align-items:center;gap:9px;font-size:24px;margin:32px 0 18px;padding-right:14px;border-right:5px solid var(--red)}
.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.product-card{position:relative;overflow:hidden;padding:21px 14px;text-align:center;background:rgba(255,255,255,.025);backdrop-filter:blur(9px);border:1px solid rgba(255,255,255,.06);border-radius:25px;box-shadow:0 10px 35px rgba(0,0,0,.18);transition:.3s}
.product-card:before{content:"";position:absolute;inset:-2px;background:linear-gradient(125deg,transparent 25%,rgba(255,40,10,.14),transparent 70%);transform:translateX(-100%);transition:.7s}
.product-card:hover:before{transform:translateX(100%)}
.product-card:hover{transform:translateY(-5px);border-color:rgba(255,40,20,.4);box-shadow:0 18px 50px rgba(150,0,0,.16)}
.product-card h4{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1.5}
.price{margin-top:7px;color:#ff4b25;font-size:20px;font-weight:1000;direction:ltr}
.old{margin-top:2px;color:#666;font-size:12px;text-decoration:line-through;direction:ltr}
.special-card{background:linear-gradient(145deg,rgba(115,0,0,.30),rgba(255,20,0,.055));border:2px solid rgba(255,25,10,.72);box-shadow:0 0 30px rgba(190,0,0,.16),inset 0 0 28px rgba(255,20,0,.04)}
.special-card:after{content:"ویژه";position:absolute;top:12px;left:-31px;width:112px;padding:5px 0;background:var(--red);transform:rotate(-38deg);font-size:11px;font-weight:1000}
.buy-btn{width:100%;margin-top:11px;padding:11px 14px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-size:14px;font-weight:900;cursor:pointer;transition:.25s}
.buy-btn:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 8px 25px rgba(224,0,0,.22)}
.buy-btn.added{background:#292929;color:#999;cursor:not-allowed;box-shadow:none;transform:none}
.modal{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.80);backdrop-filter:blur(12px)}
.modal-card{position:relative;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:27px;background:linear-gradient(145deg,rgba(16,16,16,.98),rgba(5,5,5,.98));border:1px solid rgba(255,30,15,.28);border-radius:27px;box-shadow:0 25px 90px rgba(0,0,0,.65)}
.modal-card h3{margin-bottom:18px;text-align:center;font-size:21px}
.close{position:absolute;top:12px;right:15px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.05);color:#aaa;font-size:22px;font-weight:900;cursor:pointer;transition:.2s}
.close:hover{background:var(--red);color:#fff}
.input{width:100%;margin:7px 0;padding:13px 15px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.045);color:#fff;outline:none;font-size:14px}
.input:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(224,0,0,.08)}
.btn-primary{width:100%;margin-top:9px;padding:12px 14px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-size:15px;font-weight:900;cursor:pointer;transition:.25s}
.btn-primary:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 8px 25px rgba(224,0,0,.22)}
.btn-secondary{width:100%;margin-top:9px;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.045);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.cart-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.cart-name{font-weight:800;line-height:1.5}
.cart-price{color:#ff4b25;font-weight:900;direction:ltr;white-space:nowrap}
.remove-btn{width:34px;height:34px;border:0;border-radius:11px;background:#9d0000;color:#fff;font-size:20px;font-weight:900;cursor:pointer;transition:.2s}
.remove-btn:hover{background:#e00000;transform:scale(1.06)}
#cart-total-display{margin-top:13px;padding-top:13px;border-top:2px solid var(--red);text-align:left;font-size:18px;font-weight:1000}
.empty{padding:25px 5px;color:#888;text-align:center}
.receipt{padding:15px;background:rgba(255,255,255,.025);border:1px dashed rgba(255,60,30,.35);border-radius:19px}
.receipt-head{margin-bottom:12px;text-align:center;line-height:1.8}
.receipt-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.receipt-total{margin-top:12px;padding-top:12px;border-top:2px solid var(--red);color:#ff4b25;font-size:19px;font-weight:1000}
.receipt-meta{margin-top:9px;color:#aaa;font-size:12px;line-height:1.9}
.notice-text{padding:18px 4px;color:#ddd;text-align:center;line-height:2}
.rubika-id{margin:5px 0 15px;color:#ff4b25;text-align:center;direction:ltr;font-size:18px;font-weight:1000}
.profile-box{padding:10px 0;text-align:center}
.avatar{width:84px;height:84px;margin:0 auto 12px;display:grid;place-items:center;overflow:hidden;background:#191919;border:2px solid var(--red);border-radius:50%;font-size:30px}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{margin-bottom:16px;font-size:20px;font-weight:1000}
.profile-label{margin-top:10px;color:#aaa;text-align:right;font-size:13px}
#site-toast{position:fixed;top:16px;left:50%;z-index:500;width:min(390px,92vw);padding:15px 18px;transform:translate(-50%,-160%);opacity:0;overflow:hidden;border:1px solid rgba(255,150,120,.35);border-radius:17px;background:linear-gradient(110deg,#680000,#d50000,#7b0000);box-shadow:0 10px 45px rgba(190,0,0,.42);text-align:center;font-weight:900;transition:transform .35s,opacity .35s}
#site-toast.show{transform:translate(-50%,0);opacity:1}
#site-toast:before,#site-toast:after{content:"";position:absolute;bottom:-20px;width:45px;height:45px;background:rgba(255,90,20,.22);border-radius:50%;filter:blur(5px);animation:fire 1s infinite alternate}
#site-toast:before{right:20%}#site-toast:after{left:22%;animation-delay:.25s}
@keyframes fire{to{transform:translateY(-13px) scale(.82);opacity:.45}}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;z-index:80;background:rgba(8,8,8,.9);backdrop-filter:blur(18px);border-top:1px solid rgba(255,30,15,.16);display:flex;justify-content:space-around;padding:8px 5px}
.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;color:#888;cursor:pointer;padding:5px 18px;border-radius:14px;transition:.25s}
.nav-item.active,.nav-item:hover{color:#ff3920;background:rgba(255,20,10,.06)}
.nav-item span:first-child{font-size:21px}.nav-item span:last-child{font-size:11px;margin-top:2px}
.badge{position:absolute;top:-2px;right:3px;background:var(--red);color:#fff;font-size:10px;font-weight:1000;padding:2px 6px;border-radius:20px;min-width:18px;text-align:center}
@media(min-width:760px){.product-grid{grid-template-columns:repeat(4,1fr)}.special-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.content{padding:12px}.logo{font-size:22px}.header-btn{padding:8px 10px;font-size:12px}.product-card{padding:17px 10px}.product-card h4{font-size:14px}.price{font-size:17px}.modal-card{padding:23px 17px}.cart-item{grid-template-columns:1fr auto auto}.nav-item{padding:5px 12px}}
</style>
</head>
<body>

<canvas id="backgroundCanvas"></canvas>
<div id="site-toast"></div>

<div class="content">
<div class="container">

<header>
<div class="header-row">
<div class="logo">🤖 MIKO SHOP</div>
<div class="header-actions">
<button class="header-btn" onclick="openAuth()">👤 ورود/ثبت‌نام</button>
<button class="header-btn" onclick="showCartNav()">🛒 <span id="header-cart-count">0</span></button>
</div>
</div>
</header>

<h2 class="section-title">✨ محصولات </h2>
<div class="product-grid" id="product-grid"></div>

<h2 class="section-title">🔥 محصولات ویژه</h2>
<div class="product-grid special-grid" id="special-grid"></div>

</div>
</div>

<!-- سبد خرید -->
<div id="cart-modal" class="modal">
<div class="modal-card">
<span class="close" onclick="closeModal('cart-modal')">×</span>
<h3>🛒 سبد خرید</h3>
<div id="cart-items-list"></div>
<div id="cart-total-display"></div>
<button class="btn-primary" onclick="showReceipt()">🧾 دریافت فیش</button>
</div>
</div>

<!-- فیش -->
<div id="receipt-modal" class="modal">
<div class="modal-card">
<span class="close" onclick="closeModal('receipt-modal')">×</span>
<h3>🧾 فیش خرید</h3>
<div id="receipt-content"></div>
<button class="btn-primary" onclick="copyReceipt()">📋 کپی فیش</button>
<button class="btn-primary" onclick="openOrderModal()">📤 ارسال سفارش</button>
</div>
</div>

<!-- ارسال سفارش -->
<div id="order-modal" class="modal">
<div class="modal-card">
<span class="close" onclick="closeModal('order-modal')">×</span>
<h3>📦 ارسال سفارش</h3>
<div class="notice-text">جهت سفارش، فیش کپی شده را در روبیکا به پشتیبانی سایت ارسال نمایید.</div>
<div class="rubika-id">@Ahmadreza_Programmer</div>
<button class="btn-primary" onclick="openRubika()">📤 ارسال</button>
</div>
</div>
<!-- ورود / ثبت نام -->
<div id="auth-modal" class="modal">
<div class="modal-card">
<span class="close" onclick="closeModal('auth-modal')">×</span>
<h3>👤 ورود / ثبت‌نام</h3>
<div class="profile-box">
<div class="avatar" id="auth-avatar">📷</div>
<input type="file" id="avatar-input" accept="image/*" hidden onchange="loadAvatar(event)">
<button class="btn-secondary" onclick="document.getElementById('avatar-input').click()">🖼️ انتخاب تصویر</button>
</div>
<input class="input" id="register-username" placeholder="نام کاربری (فقط انگلیسی)">
<input class="input" id="register-email" type="email" placeholder="ایمیل">
<input class="input" id="register-password" type="password" placeholder="رمز عبور (حروف انگلیسی و اعداد)">
<button class="btn-primary" onclick="registerUser()">ورود / ثبت‌نام</button>
</div>
</div>

<!-- پروفایل -->
<div id="profile-modal" class="modal">
<div class="modal-card">
<span class="close" onclick="closeModal('profile-modal')">×</span>
<div id="profile-content"></div>
</div>
</div>

<nav class="bottom-nav">
<div class="nav-item active" onclick="showHome()"><span>🏠</span><span>صفحه اصلی</span></div>
<div class="nav-item" onclick="showCartNav()"><span>🛒</span><span>سبد خرید</span><span class="badge" id="cart-badge">0</span></div>
<div class="nav-item" onclick="showProfileNav()"><span>👤</span><span>پروفایل من</span></div>
</nav>

<script>
const products=[
{id:1,name:"پک برنامه‌های کد فیلتری",price:100000},
{id:2,name:"کدهای فیلتری",price:20000},
{id:3,name:"کدهای رفع فیلتری",price:30000},
{id:4,name:"کدهای هنگی",price:10000},
{id:5,name:"رفع فیلتر کردن حساب",price:50000},
{id:6,name:"فیلتر کردن حساب",price:80000},
{id:7,name:"کد فیلتری گروه",price:25000},
{id:8,name:"کد فیلتری کانال",price:25000}
];
const specials=[
{id:9,name:"ساخت سایت اختصاصی",price:250000},
{id:10,name:"ساخت ربات اختصاصی",price:60000}
];

let cart=JSON.parse(localStorage.getItem("fastShopCart")||"[]");
let currentUser=JSON.parse(localStorage.getItem("fastShopUser")||"null");
let avatarData=localStorage.getItem("fastShopAvatar")||"";
let receiptData=null;
let toastTimer=null;

const money=n=>Number(n).toLocaleString("en-US");
const allProducts=[...products,...specials];

function saveState(){
localStorage.setItem("fastShopCart",JSON.stringify(cart));
if(currentUser)localStorage.setItem("fastShopUser",JSON.stringify(currentUser));
else localStorage.removeItem("fastShopUser");
if(avatarData)localStorage.setItem("fastShopAvatar",avatarData);
}

function notify(message){
const t=document.getElementById("site-toast");
t.textContent=message;
t.classList.add("show");
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>t.classList.remove("show"),5000);
}

function escapeHTML(s){
return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function createCard(p,isSpecial=false){
const card=document.createElement("div");
card.className="product-card"+(isSpecial?" special-card":"");
const added=cart.some(i=>i.id===p.id);
card.innerHTML=`<h4>${escapeHTML(p.name)}</h4><div class="price">${money(p.price)} تومان</div><div class="old">${money(Math.round(p.price*1.25))} تومان</div><button class="buy-btn ${added?"added":""}" id="buy-${p.id}" ${added?"disabled":""} onclick="addToCart(${p.id})">${added?"✓ اضافه شده":"افزودن به سبد خرید"}</button>`;
return card;
}
function renderProducts(){
document.getElementById("product-grid").innerHTML="";
products.forEach(p=>document.getElementById("product-grid").appendChild(createCard(p)));
document.getElementById("special-grid").innerHTML="";
specials.forEach(p=>document.getElementById("special-grid").appendChild(createCard(p,true)));
}
function addToCart(id){
if(cart.some(i=>i.id===id)){notify("این محصول قبلاً در سبد خرید است.");return}
const p=allProducts.find(x=>x.id===id);if(!p)return;
cart.push({id:p.id,name:p.name,price:p.price});
saveState();updateCartUI();renderProducts();
notify(`🛒 محصول ${p.name} به سبد خرید اضافه شد!`);
}
function removeFromCart(id){
const p=cart.find(i=>i.id===id);
cart=cart.filter(i=>i.id!==id);
saveState();updateCartUI();renderProducts();renderCart();
if(p)notify(`🔥 محصول ${p.name} از سبد خرید حذف شد.`);
}
function updateCartUI(){
const n=cart.length;
document.getElementById("cart-badge").textContent=n;
document.getElementById("header-cart-count").textContent=n;
}
function renderCart(){
const list=document.getElementById("cart-items-list"),total=document.getElementById("cart-total-display");
if(!cart.length){list.innerHTML='<div class="empty">🛍️ سبد خرید شما خالی است.</div>';total.textContent="";return}
let sum=0;
list.innerHTML=cart.map(i=>{sum+=i.price;return `<div class="cart-item"><div class="cart-name">${escapeHTML(i.name)}</div><div class="cart-price">${money(i.price)} تومان</div><button class="remove-btn" onclick="removeFromCart(${i.id})">×</button></div>`}).join("");
total.innerHTML=`💰 جمع کل: <b>${money(sum)} تومان</b>`;
}
function showCart(){renderCart();openModal("cart-modal")}
function showCartNav(){setActive(2);showCart()}
function closeModal(id){document.getElementById(id).style.display="none"}
function openModal(id){document.getElementById(id).style.display="flex"}
function showReceipt(){
if(!cart.length){notify("🛒 سبد خرید خالی است.");return}
const now=new Date(),date=now.toLocaleDateString("fa-IR"),time=now.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"}),customer=currentUser?.username||"مهمان";
let total=0;
const rows=cart.map(i=>{total+=i.price;return `<div class="receipt-item"><span>🛍️ ${escapeHTML(i.name)}</span><b>${money(i.price)} تومان</b></div>`}).join("");
receiptData={items:cart.map(i=>({name:i.name,price:i.price})),total,date,time,customer};
document.getElementById("receipt-content").innerHTML=`<div class="receipt"><div class="receipt-head">⚡ <b>FAST SHOP</b><br>🧾 فیش خرید</div>${rows}<div class="receipt-total">💰 جمع کل: ${money(total)} تومان</div><div class="receipt-meta">👤 نام: ${escapeHTML(customer)}<br>📅 تاریخ: ${date}<br>⏰ ساعت: ${time}</div></div>`;
openModal("receipt-modal");
}
function receiptText(){
let s=`🧾 فیش خرید FAST SHOP\n━━━━━━━━━━━━━━\n👤 نام: ${receiptData.customer}\n📅 تاریخ: ${receiptData.date}\n⏰ ساعت: ${receiptData.time}\n\n`;
receiptData.items.forEach(i=>s+=`🛍️ ${i.name} — ${money(i.price)} تومان\n`);
return s+`\n💰 جمع کل: ${money(receiptData.total)} تومان\n━━━━━━━━━━━━━━`;
}
async function copyReceipt(){
if(!receiptData){notify("فیشی برای کپی وجود ندارد.");return}
try{await navigator.clipboard.writeText(receiptText())}
catch(e){const t=document.createElement("textarea");t.value=receiptText();document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
notify("📋 فیش با موفقیت کپی شد!");
}
function openOrderModal(){if(!receiptData){notify("ابتدا فیش را دریافت کنید.");return}openModal("order-modal")}
function openRubika(){window.open("https://rubika.ir/@Ahmadreza_Programmer","_blank")}
function openAuth(){if(currentUser){renderProfile();openModal("profile-modal")}else openModal("auth-modal")}
function registerUser(){
const u=document.getElementById("register-username").value.trim(),e=document.getElementById("register-email").value.trim(),p=document.getElementById("register-password").value;
if(!u||!e||!p){notify("لطفاً همه فیلدها را کامل کنید.");return}
if(!/^[A-Za-z]+$/.test(u)){notify("نام کاربری فقط باید حروف انگلیسی باشد.");return}
if(!/^[A-Za-z0-9]+$/.test(p)){notify("رمز عبور فقط باید حروف انگلیسی و اعداد باشد.");return}
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){notify("ایمیل واردشده معتبر نیست.");return}
currentUser={username:u,email:e,password:p};saveState();closeModal("auth-modal");renderProfile();openModal("profile-modal");notify("🔥 عضویت با موفقیت ثبت شد!");
}
function renderProfile(){
const c=document.getElementById("profile-content");
if(!currentUser){c.innerHTML=`<h3>👤 پروفایل من</h3><div class="notice-text">جهت استفاده از این بخش اول باید از بخش «ورود/ثبت نام» وارد شوید.</div>`;return}
const avatar=avatarData?`<img src="${avatarData}">`:"👤";
c.innerHTML=`<h3>👤 پروفایل من</h3><div class="profile-box"><div class="avatar">${avatar}</div><div class="profile-name">${escapeHTML(currentUser.username)}</div></div><div class="profile-label">پسورد فعلی:</div><input class="input" id="old-password" type="password" placeholder="پسورد فعلی"><div class="profile-label">پسورد جدید:</div><input class="input" id="new-password" type="password" placeholder="پسورد جدید"><button class="btn-primary" onclick="changePassword()">تایید تغییر پسورد</button>`;
}
function changePassword(){
const oldP=document.getElementById("old-password").value,newP=document.getElementById("new-password").value;
if(oldP!==currentUser.password){notify("پسورد فعلی صحیح نیست.");return}
if(!/^[A-Za-z0-9]+$/.test(newP)||newP.length<4){notify("پسورد جدید معتبر نیست.");return}
currentUser.password=newP;saveState();notify("🔥 پسورد با موفقیت عوض شد!");
}
function loadAvatar(e){
const file=e.target.files?.[0];if(!file)return;
const r=new FileReader();r.onload=x=>{avatarData=x.target.result;saveState();document.getElementById("auth-avatar").innerHTML=`<img src="${avatarData}" style="width:100%;height:100%;object-fit:cover">`};r.readAsDataURL(file);
}
function showProfileNav(){setActive(3);if(currentUser){renderProfile();openModal("profile-modal")}else openModal("auth-modal")}
function showHome(){setActive(1);window.scrollTo({top:0,behavior:"smooth"})}
function setActive(n){document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));document.querySelector(`.nav-item:nth-child(${n})`).classList.add("active")}
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.style.display="none"}));

const canvas=document.getElementById("backgroundCanvas"),ctx=canvas.getContext("2d");
let W=0,H=0,particles=[];
function resizeCanvas(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
addEventListener("resize",resizeCanvas);resizeCanvas();
for(let i=0;i<65;i++)particles.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*20+4,s:Math.random()*.8+.2,a:Math.random()*.25+.05});
function animate(){
ctx.clearRect(0,0,W,H);
particles.forEach(p=>{p.y-=p.s;p.x+=Math.sin(p.y*.008)*.18;if(p.y<-30){p.y=H+30;p.x=Math.random()*W}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(210,0,0,${p.a})`;ctx.fill()});
requestAnimationFrame(animate);
}
animate();

renderProducts();
updateCartUI();
</script>
</body>
</html>
